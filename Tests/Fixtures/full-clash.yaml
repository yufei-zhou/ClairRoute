# Fake credentials only. Full-template runtime settings are deliberately not trusted.
mixed-port: 7890
port: 7891
socks-port: 7892
mode: global
allow-lan: true
bind-address: '*'
log-level: info
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver: [8.8.8.8]
tun:
  enable: true
  device: utun12
  auto-route: true
proxies:
  - name: Template SS
    type: ss
    server: template.example.test
    port: 443
    cipher: aes-256-gcm
    password: 'fixture-only-password'
proxy-providers:
  local-bundle:
    type: inline
    payload:
      - name: Template VMess
        type: vmess
        server: template.example.test
        port: 443
        uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        alterId: 0
        cipher: auto
proxy-groups:
  - name: Proxy
    type: select
    proxies: [Template SS, DIRECT]
    use: [local-bundle]
rules:
  - DOMAIN-SUFFIX,example.test,Proxy
  - MATCH,Proxy
